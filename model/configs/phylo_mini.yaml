general:
  name: phylo_mini
  wandb: online
  gpus: 1
  check_val_every_n_epochs: 2
  sample_every_val: 1
  samples_to_generate: 10
  samples_to_save: 1
  chains_to_save: 1
  final_model_samples_to_generate: 10
  final_model_samples_to_save: 1
  final_model_chains_to_save: 1
  log_every_steps: 50
  number_chain_steps: 50

model:
  transition: marginal
  diffusion_steps: 1000
  diffusion_noise_schedule: cosine
  n_layers: 8
  hidden_mlp_dims:
    X: 128
    E: 64
    'y': 128
  hidden_dims:
    dx: 256
    de: 64
    dy: 64
    n_head: 8
    dim_ffX: 256
    dim_ffE: 64
    dim_ffy: 256
  lambda_train:
    - 5
    - 0

train:
  n_epochs: 10
  batch_size: 64
  lr: 0.0002
  clip_grad: null
  save_model: true
  num_workers: 0
  ema_decay: 0
  progress_bar: false
  weight_decay: 1.0e-12
  optimizer: adamw
  seed: 0
  log_gpu_memory: false  # Log GPU memory usage each epoch
  checkpoint_every_n_epochs: 5  # Periodic checkpoints (epoch100, epoch200, ...)

dataset:
  data_path: model/data/main_filtered.pkl
  split_ratios:
    - 0.8
    - 0.1
    - 0.1
  split_seed: 0
