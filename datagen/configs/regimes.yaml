schema_version: 2

experiment:
  run_id: "sistem_regimes_v1"
  description: "Diverse SISTEM tumor growth regimes for phylogeny + migration-graph training"
  output_root: "output/sistem_regimes_v1"

  attempts_per_tumor: 3
  keep_policy: "first_success"

  rng:
    global_seed: 20251219
    per_run_seed: "hash(run_id, regime_id, tumor_index, attempt_index)"

  splits:
    strategy: "stratified_by_regime"
    train: 0.90
    val: 0.05
    test: 0.05

sampler:
  method: "latin_hypercube"

  log10_parameters:
    - epsilon
    - focal_driver_rate
    - focal_pass_rate
    - SNV_driver_rate
    - SNV_pass_rate
    - arm_rate
    - chromosomal_rate
    - WGD_rate

  deduplication:
    enabled: true
    key_rounding_sigfigs: 4

  constraints:
    - name: "detectable_lt_capacity"
      expr: "min_detectable < min(capacities)"
    - name: "ratios_in_0_1"
      expr: "0 < OG_r < 1 and 0 < TSG_r < 1 and 0 <= EG_r < 1"

defaults:
  sistem_parameters:
    num_chrom: 22
    region_len: 5000000
    bin_size: null

    t_max: 6000
    lifespan_mean: 1
    N0: 10

    max_distinct_driv_ratio: 0.8
    max_region_CN: 10
    max_region_SNV: 10
    max_ploidy: 8
    min_ploidy: 1.5

    length_mean: 1.5
    mag_mean: 1.2
    focal_gain_rate: 0.5

    ncells_normal: 1
    ncells_prim: 8000
    ncells_meta: 4000
    min_mut_fraction: 0.05

    coverage: 100
    read_len: 150
    lorenz_y: 0.5

  outputs:
    lineage_level: "clonal"
    write_full_trees: false
    write_readcounts_bulk: false
    write_readcounts_singlecell: false

    keep_files:
      - sim.log
      - clone_tree.nwk
      - migration_graph.tsv
      - observed_CNPs.tsv
      - SNV_profiles.tsv
      - CNA_events.tsv
      - SNV_events.tsv

  filters:
    min_clone_tree_nodes: 10
    max_clone_tree_nodes: 2000
    require_metastasis_if_multisite: true

regimes:
  - id: "R01_single_site_arm_neutral"
    n_tumors: 2000
    description: "Single-site, weak selection + low driver rates -> more balanced/neutral branching trees."
    sistem:
      selection_library: {class: "RandomArmLibrary", init: {from_params: true}}
      anatomy: {class: "SimpleAnatomy"}
    parameters:
      nsites: {dist: fixed, value: 1}
      capacities: {dist: log_uniform_int, min: 2000000, max: 50000000}
      min_detectable:
        dist: fraction_of
        of: capacities
        fraction: {dist: uniform, min: 0.05, max: 0.30}
      growth_rate: {dist: uniform, min: 0.002, max: 0.010}
      epsilon: {dist: fixed, value: 1e-12}

      focal_driver_rate: {dist: log_uniform, min: 1e-6, max: 3e-5}
      focal_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}
      arm_rate: {dist: log_uniform, min: 1e-7, max: 1e-5}
      chromosomal_rate: {dist: log_uniform, min: 1e-8, max: 1e-6}
      WGD_rate: {dist: log_uniform, min: 1e-10, max: 1e-8}

      SNV_driver_rate: {dist: fixed, value: 0.0}
      SNV_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}

      CN_coeff: {dist: uniform, min: 0.02, max: 0.10}
      ncells_prim: {dist: int_range, min: 2000, max: 15000}
      min_mut_fraction: {dist: log_uniform, min: 0.01, max: 0.10}

  - id: "R02_single_site_arm_strong_selection"
    n_tumors: 2000
    description: "Single-site, stronger selection + higher driver rates -> imbalanced/sweep-like trees."
    sistem:
      selection_library: {class: "RandomArmLibrary", init: {from_params: true}}
      anatomy: {class: "SimpleAnatomy"}
    parameters:
      nsites: {dist: fixed, value: 1}
      capacities: {dist: log_uniform_int, min: 10000000, max: 100000000}
      min_detectable:
        dist: fraction_of
        of: capacities
        fraction: {dist: uniform, min: 0.20, max: 0.80}
      growth_rate: {dist: uniform, min: 0.004, max: 0.020}

      focal_driver_rate: {dist: log_uniform, min: 1e-5, max: 3e-4}
      focal_pass_rate: {dist: log_uniform, min: 1e-3, max: 2e-2}
      arm_rate: {dist: log_uniform, min: 1e-6, max: 1e-4}
      chromosomal_rate: {dist: log_uniform, min: 1e-8, max: 1e-6}
      WGD_rate: {dist: log_uniform, min: 1e-9, max: 1e-7}

      SNV_driver_rate: {dist: fixed, value: 0.0}
      SNV_pass_rate: {dist: log_uniform, min: 5e-4, max: 2e-2}

      CN_coeff: {dist: uniform, min: 0.10, max: 0.35}
      t_max: {dist: int_range, min: 5000, max: 12000}
      ncells_prim: {dist: int_range, min: 5000, max: 20000}
      min_mut_fraction: {dist: log_uniform, min: 0.005, max: 0.05}

  - id: "R03_single_site_region_moderate"
    n_tumors: 2000
    description: "Single-site, region-level CNA drivers -> richer branching at moderate selection."
    sistem:
      selection_library:
        class: "RandomRegionLibrary"
        init: {from_params: true}
      anatomy: {class: "SimpleAnatomy"}
    parameters:
      nsites: {dist: fixed, value: 1}
      capacities: {dist: log_uniform_int, min: 5000000, max: 50000000}
      min_detectable:
        dist: fraction_of
        of: capacities
        fraction: {dist: uniform, min: 0.10, max: 0.60}
      growth_rate: {dist: uniform, min: 0.003, max: 0.015}

      focal_driver_rate: {dist: log_uniform, min: 1e-5, max: 5e-4}
      focal_pass_rate: {dist: log_uniform, min: 1e-3, max: 5e-2}
      arm_rate: {dist: log_uniform, min: 1e-7, max: 1e-5}
      chromosomal_rate: {dist: log_uniform, min: 1e-8, max: 1e-6}
      WGD_rate: {dist: log_uniform, min: 1e-10, max: 1e-8}

      SNV_driver_rate: {dist: fixed, value: 0.0}
      SNV_pass_rate: {dist: log_uniform, min: 1e-3, max: 5e-2}

      CN_coeff: {dist: uniform, min: 0.05, max: 0.25}
      OG_r: {dist: uniform, min: 0.02, max: 0.10}
      TSG_r: {dist: uniform, min: 0.02, max: 0.10}
      EG_r: {dist: uniform, min: 0.00, max: 0.10}

      max_ploidy: {dist: int_range, min: 6, max: 10}
      ncells_prim: {dist: int_range, min: 2000, max: 15000}
      min_mut_fraction: {dist: log_uniform, min: 0.01, max: 0.10}

  - id: "R04_single_site_hybrid_snv_driven"
    n_tumors: 2000
    description: "Single-site, hybrid CNA+SNV driver model -> mixed driver types and different tree shapes."
    sistem:
      selection_library:
        class: "RandomHybridLibrary"
        init: {from_params: true}
      anatomy: {class: "SimpleAnatomy"}
    parameters:
      nsites: {dist: fixed, value: 1}
      capacities: {dist: log_uniform_int, min: 5000000, max: 50000000}
      min_detectable:
        dist: fraction_of
        of: capacities
        fraction: {dist: uniform, min: 0.10, max: 0.60}
      growth_rate: {dist: uniform, min: 0.003, max: 0.015}

      focal_driver_rate: {dist: log_uniform, min: 1e-6, max: 1e-4}
      focal_pass_rate: {dist: log_uniform, min: 1e-3, max: 5e-2}
      arm_rate: {dist: log_uniform, min: 1e-7, max: 1e-5}
      chromosomal_rate: {dist: log_uniform, min: 1e-8, max: 1e-6}
      WGD_rate: {dist: log_uniform, min: 1e-10, max: 1e-8}

      SNV_driver_rate: {dist: log_uniform, min: 1e-6, max: 5e-4}
      SNV_pass_rate: {dist: log_uniform, min: 1e-3, max: 1e-1}

      CN_coeff: {dist: uniform, min: 0.02, max: 0.15}
      SNV_coeff: {dist: uniform, min: 0.01, max: 0.15}
      OG_r: {dist: uniform, min: 0.02, max: 0.10}
      TSG_r: {dist: uniform, min: 0.02, max: 0.10}
      EG_r: {dist: uniform, min: 0.01, max: 0.10}

      ncells_prim: {dist: int_range, min: 2000, max: 15000}
      min_mut_fraction: {dist: log_uniform, min: 0.01, max: 0.10}

  - id: "R05_single_site_high_CIN_WGD"
    n_tumors: 2000
    description: "Single-site, high CIN + WGD -> deep trees and complex CN states."
    sistem:
      selection_library: {class: "RandomArmLibrary", init: {from_params: true}}
      anatomy: {class: "SimpleAnatomy"}
    parameters:
      nsites: {dist: fixed, value: 1}
      capacities: {dist: log_uniform_int, min: 10000000, max: 100000000}
      min_detectable:
        dist: fraction_of
        of: capacities
        fraction: {dist: uniform, min: 0.30, max: 0.90}
      growth_rate: {dist: uniform, min: 0.004, max: 0.020}

      focal_driver_rate: {dist: log_uniform, min: 1e-4, max: 1e-3}
      focal_pass_rate: {dist: log_uniform, min: 5e-3, max: 5e-2}
      arm_rate: {dist: log_uniform, min: 1e-5, max: 1e-3}
      chromosomal_rate: {dist: log_uniform, min: 1e-6, max: 1e-4}
      WGD_rate: {dist: log_uniform, min: 1e-9, max: 1e-6}

      length_mean: {dist: uniform, min: 1.0, max: 5.0}
      mag_mean: {dist: uniform, min: 1.2, max: 3.0}
      focal_gain_rate: {dist: uniform, min: 0.20, max: 0.80}

      SNV_driver_rate: {dist: fixed, value: 0.0}
      SNV_pass_rate: {dist: log_uniform, min: 1e-3, max: 2e-2}

      CN_coeff: {dist: uniform, min: 0.05, max: 0.25}
      max_ploidy: {dist: int_range, min: 8, max: 16}
      max_region_CN: {dist: int_range, min: 10, max: 20}

      t_max: {dist: int_range, min: 6000, max: 12000}
      ncells_prim: {dist: int_range, min: 5000, max: 20000}
      min_mut_fraction: {dist: log_uniform, min: 0.005, max: 0.05}

  - id: "R06_3site_static_low_migration_shared_landscape"
    n_tumors: 1500
    description: "3 sites + static migration, low epsilon -> sparse migration graphs."
    sistem:
      selection_library: {class: "RandomArmLibrary", init: {from_params: true}}
      anatomy:
        class: "StaticAnatomy"
        distances: {method: "random"}
        metastatic_libraries: {enabled: false}
    parameters:
      nsites: {dist: fixed, value: 3}
      capacities:
        dist: per_site_from_base
        base: {dist: log_uniform_int, min: 5000000, max: 50000000}
        multiplier: {dist: log_uniform, min: 0.5, max: 2.0}
      min_detectable:
        dist: fraction_of
        of: capacities
        fraction: {dist: uniform, min: 0.05, max: 0.30}
      growth_rate: {dist: uniform, min: 0.002, max: 0.010}
      max_growth_rate_multiplier: {dist: uniform, min: 1.0, max: 4.0}
      epsilon: {dist: log_uniform, min: 1e-10, max: 1e-8}

      focal_driver_rate: {dist: log_uniform, min: 1e-5, max: 5e-4}
      focal_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}
      arm_rate: {dist: log_uniform, min: 1e-7, max: 1e-5}
      chromosomal_rate: {dist: log_uniform, min: 1e-8, max: 1e-6}
      WGD_rate: {dist: log_uniform, min: 1e-10, max: 1e-8}
      SNV_driver_rate: {dist: fixed, value: 0.0}
      SNV_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}

      CN_coeff: {dist: uniform, min: 0.05, max: 0.25}
      ncells_prim: {dist: int_range, min: 5000, max: 20000}
      ncells_meta: {dist: int_range, min: 2000, max: 15000}
      min_mut_fraction: {dist: log_uniform, min: 0.01, max: 0.10}

  - id: "R07_3site_static_distance_landscapes"
    n_tumors: 1500
    description: "3 sites + static migration + distance-altered metastatic libraries."
    sistem:
      selection_library: {class: "RandomArmLibrary", init: {from_params: true}}
      anatomy:
        class: "StaticAnatomy"
        distances: {method: "random"}
        metastatic_libraries:
          enabled: true
          method: "distance"
          from_params: true
    parameters:
      nsites: {dist: fixed, value: 3}
      capacities:
        dist: per_site_from_base
        base: {dist: log_uniform_int, min: 5000000, max: 50000000}
        multiplier: {dist: log_uniform, min: 0.5, max: 2.0}
      min_detectable:
        dist: fraction_of
        of: capacities
        fraction: {dist: uniform, min: 0.08, max: 0.40}
      growth_rate: {dist: uniform, min: 0.003, max: 0.012}
      max_growth_rate_multiplier: {dist: uniform, min: 2.0, max: 8.0}
      epsilon: {dist: log_uniform, min: 1e-9, max: 1e-7}
      alter_prop: {dist: uniform, min: 0.05, max: 0.50}

      focal_driver_rate: {dist: log_uniform, min: 1e-5, max: 5e-4}
      focal_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}
      arm_rate: {dist: log_uniform, min: 1e-7, max: 1e-5}
      chromosomal_rate: {dist: log_uniform, min: 1e-8, max: 1e-6}
      WGD_rate: {dist: log_uniform, min: 1e-10, max: 1e-8}
      SNV_driver_rate: {dist: fixed, value: 0.0}
      SNV_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}

      CN_coeff: {dist: uniform, min: 0.05, max: 0.25}
      ncells_prim: {dist: int_range, min: 5000, max: 20000}
      ncells_meta: {dist: int_range, min: 2000, max: 15000}
      min_mut_fraction: {dist: log_uniform, min: 0.01, max: 0.10}

  - id: "R08_5site_static_high_migration_reseeding"
    n_tumors: 1500
    description: "5 sites + higher epsilon -> richer migration graphs / reseeding."
    sistem:
      selection_library: {class: "RandomArmLibrary", init: {from_params: true}}
      anatomy:
        class: "StaticAnatomy"
        distances: {method: "random"}
        metastatic_libraries: {enabled: true, method: "random", from_params: true}
    parameters:
      nsites: {dist: fixed, value: 5}
      capacities:
        dist: per_site_from_base
        base: {dist: log_uniform_int, min: 3000000, max: 30000000}
        multiplier: {dist: log_uniform, min: 0.5, max: 2.0}
      min_detectable:
        dist: fraction_of
        of: capacities
        fraction: {dist: uniform, min: 0.05, max: 0.25}
      growth_rate: {dist: uniform, min: 0.003, max: 0.012}
      max_growth_rate_multiplier: {dist: uniform, min: 1.0, max: 6.0}
      epsilon: {dist: log_uniform, min: 1e-8, max: 1e-6}
      alter_prop: {dist: uniform, min: 0.00, max: 0.30}

      focal_driver_rate: {dist: log_uniform, min: 1e-5, max: 5e-4}
      focal_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}
      arm_rate: {dist: log_uniform, min: 1e-7, max: 1e-5}
      chromosomal_rate: {dist: log_uniform, min: 1e-8, max: 1e-6}
      WGD_rate: {dist: log_uniform, min: 1e-10, max: 1e-8}
      SNV_driver_rate: {dist: fixed, value: 0.0}
      SNV_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}

      CN_coeff: {dist: uniform, min: 0.05, max: 0.25}
      ncells_prim: {dist: int_range, min: 3000, max: 12000}
      ncells_meta: {dist: int_range, min: 2000, max: 8000}
      min_mut_fraction: {dist: log_uniform, min: 0.01, max: 0.10}

  - id: "R09_5site_genotype_migration_shared"
    n_tumors: 1500
    description: "5 sites + genotype-driven migration -> route probabilities depend on destination fitness."
    sistem:
      selection_library: {class: "RandomArmLibrary", init: {from_params: true}}
      anatomy: {class: "GenotypeAnatomy", distances: {method: "random"}, metastatic_libraries: {enabled: false}}
    parameters:
      nsites: {dist: fixed, value: 5}
      capacities:
        dist: per_site_from_base
        base: {dist: log_uniform_int, min: 3000000, max: 30000000}
        multiplier: {dist: log_uniform, min: 0.5, max: 2.0}
      min_detectable:
        dist: fraction_of
        of: capacities
        fraction: {dist: uniform, min: 0.05, max: 0.25}
      growth_rate: {dist: uniform, min: 0.003, max: 0.012}
      max_growth_rate_multiplier: {dist: uniform, min: 1.0, max: 6.0}

      epsilon: {dist: log_uniform, min: 1e-10, max: 1e-8}

      focal_driver_rate: {dist: log_uniform, min: 1e-5, max: 5e-4}
      focal_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}
      arm_rate: {dist: log_uniform, min: 1e-7, max: 1e-5}
      chromosomal_rate: {dist: log_uniform, min: 1e-8, max: 1e-6}
      WGD_rate: {dist: log_uniform, min: 1e-10, max: 1e-8}
      SNV_driver_rate: {dist: fixed, value: 0.0}
      SNV_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}

      CN_coeff: {dist: uniform, min: 0.05, max: 0.25}
      ncells_prim: {dist: int_range, min: 3000, max: 12000}
      ncells_meta: {dist: int_range, min: 2000, max: 8000}
      min_mut_fraction: {dist: log_uniform, min: 0.01, max: 0.10}

  - id: "R10_5site_genotype_migration_organotropism"
    n_tumors: 1500
    description: "5 sites + genotype-driven migration + distance-altered landscapes -> genotypexorganotropism interactions."
    sistem:
      selection_library: {class: "RandomArmLibrary", init: {from_params: true}}
      anatomy:
        class: "GenotypeAnatomy"
        distances: {method: "random"}
        metastatic_libraries: {enabled: true, method: "distance", from_params: true}
    parameters:
      nsites: {dist: fixed, value: 5}
      capacities:
        dist: per_site_from_base
        base: {dist: log_uniform_int, min: 3000000, max: 30000000}
        multiplier: {dist: log_uniform, min: 0.5, max: 2.0}
      min_detectable:
        dist: fraction_of
        of: capacities
        fraction: {dist: uniform, min: 0.08, max: 0.40}
      growth_rate: {dist: uniform, min: 0.003, max: 0.012}
      max_growth_rate_multiplier: {dist: uniform, min: 3.0, max: 12.0}

      epsilon: {dist: log_uniform, min: 1e-9, max: 1e-6}
      alter_prop: {dist: uniform, min: 0.10, max: 0.50}

      focal_driver_rate: {dist: log_uniform, min: 1e-5, max: 5e-4}
      focal_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}
      arm_rate: {dist: log_uniform, min: 1e-7, max: 1e-5}
      chromosomal_rate: {dist: log_uniform, min: 1e-8, max: 1e-6}
      WGD_rate: {dist: log_uniform, min: 1e-10, max: 1e-8}
      SNV_driver_rate: {dist: fixed, value: 0.0}
      SNV_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}

      CN_coeff: {dist: uniform, min: 0.05, max: 0.25}
      ncells_prim: {dist: int_range, min: 3000, max: 12000}
      ncells_meta: {dist: int_range, min: 2000, max: 8000}
      min_mut_fraction: {dist: log_uniform, min: 0.01, max: 0.10}

  - id: "R11_7site_static_sparse_sampling"
    n_tumors: 500
    description: "7 sites (rare but important) -> complex migration graphs; smaller sampling to bound runtime."
    sistem:
      selection_library: {class: "RandomArmLibrary", init: {from_params: true}}
      anatomy:
        class: "StaticAnatomy"
        distances: {method: "random"}
        metastatic_libraries: {enabled: true, method: "random", from_params: true}
    parameters:
      nsites: {dist: fixed, value: 7}
      capacities:
        dist: per_site_from_base
        base: {dist: log_uniform_int, min: 2000000, max: 20000000}
        multiplier: {dist: log_uniform, min: 0.5, max: 2.0}
      min_detectable:
        dist: fraction_of
        of: capacities
        fraction: {dist: uniform, min: 0.03, max: 0.15}
      growth_rate: {dist: uniform, min: 0.003, max: 0.010}
      epsilon: {dist: log_uniform, min: 1e-9, max: 1e-7}
      alter_prop: {dist: uniform, min: 0.00, max: 0.30}

      focal_driver_rate: {dist: log_uniform, min: 1e-5, max: 5e-4}
      focal_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}
      arm_rate: {dist: log_uniform, min: 1e-7, max: 1e-5}
      chromosomal_rate: {dist: log_uniform, min: 1e-8, max: 1e-6}
      WGD_rate: {dist: log_uniform, min: 1e-10, max: 1e-8}
      SNV_driver_rate: {dist: fixed, value: 0.0}
      SNV_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}

      CN_coeff: {dist: uniform, min: 0.05, max: 0.25}
      ncells_prim: {dist: int_range, min: 2000, max: 8000}
      ncells_meta: {dist: int_range, min: 1000, max: 5000}
      min_mut_fraction: {dist: log_uniform, min: 0.02, max: 0.15}

  - id: "R12_small_trees_early_detection_low_sampling"
    n_tumors: 2000
    description: "Early detection + low sampling + more pruning -> small trees; prevents domination by huge graphs."
    sistem:
      selection_library: {class: "RandomArmLibrary", init: {from_params: true}}
      anatomy: {class: "SimpleAnatomy"}
    filters:
      max_clone_tree_nodes: 200
      require_metastasis_if_multisite: false
    parameters:
      nsites: {dist: choice, values: [1, 3]}
      capacities: {dist: log_uniform_int, min: 2000000, max: 20000000}
      min_detectable:
        dist: fraction_of
        of: capacities
        fraction: {dist: uniform, min: 0.01, max: 0.05}
      growth_rate: {dist: uniform, min: 0.001, max: 0.008}
      epsilon: {dist: log_uniform, min: 1e-11, max: 1e-8}

      focal_driver_rate: {dist: log_uniform, min: 1e-6, max: 1e-4}
      focal_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}
      arm_rate: {dist: log_uniform, min: 1e-8, max: 1e-6}
      chromosomal_rate: {dist: log_uniform, min: 1e-9, max: 1e-7}
      WGD_rate: {dist: log_uniform, min: 1e-11, max: 1e-9}

      SNV_driver_rate: {dist: fixed, value: 0.0}
      SNV_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}

      CN_coeff: {dist: uniform, min: 0.02, max: 0.15}
      N0: {dist: int_range, min: 1, max: 30}
      ncells_prim: {dist: int_range, min: 200, max: 2000}
      ncells_meta: {dist: int_range, min: 200, max: 2000}
      min_mut_fraction: {dist: log_uniform, min: 0.05, max: 0.20}
