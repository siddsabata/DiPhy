schema_version: 2

experiment:
  run_id: "sistem_regimes_smoke"
  output_root: "output/sistem_regimes_smoke"
  attempts_per_tumor: 3
  keep_policy: "first_success"
  rng:
    global_seed: 20251219

sampler:
  deduplication:
    enabled: false
  constraints:
    - name: "detectable_lt_capacity"
      expr: "min_detectable < min(capacities)"

defaults:
  sistem_parameters:
    t_max: 6000
    lifespan_mean: 1
    N0: 10
    max_distinct_driv_ratio: 0.8
    max_region_CN: 10
    max_region_SNV: 10
    max_ploidy: 8
    min_ploidy: 1.5
    length_mean: 1.5
    mag_mean: 1.2
    focal_gain_rate: 0.5
    ncells_normal: 1
    ncells_prim: 8000
    ncells_meta: 4000
    min_mut_fraction: 0.05
    coverage: 100
    read_len: 150
    lorenz_y: 0.5

regimes:
  - id: "R01_single_site_arm_neutral"
    n_tumors: 1
    sistem:
      selection_library: {class: "RandomArmLibrary", init: {from_params: true}}
      anatomy: {class: "SimpleAnatomy"}
    parameters:
      nsites: {dist: fixed, value: 1}
      capacities: {dist: log_uniform_int, min: 2000000, max: 50000000}
      min_detectable:
        dist: fraction_of
        of: capacities
        fraction: {dist: uniform, min: 0.05, max: 0.30}
      growth_rate: {dist: uniform, min: 0.002, max: 0.010}
      epsilon: {dist: fixed, value: 1e-12}
      focal_driver_rate: {dist: log_uniform, min: 1e-6, max: 3e-5}
      focal_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}
      arm_rate: {dist: log_uniform, min: 1e-7, max: 1e-5}
      chromosomal_rate: {dist: log_uniform, min: 1e-8, max: 1e-6}
      WGD_rate: {dist: log_uniform, min: 1e-10, max: 1e-8}
      SNV_driver_rate: {dist: fixed, value: 0.0}
      SNV_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}
      CN_coeff: {dist: uniform, min: 0.02, max: 0.10}
      ncells_prim: {dist: int_range, min: 2000, max: 15000}
      min_mut_fraction: {dist: log_uniform, min: 0.01, max: 0.10}

  - id: "R06_3site_static_low_migration_shared_landscape"
    n_tumors: 1
    sistem:
      selection_library: {class: "RandomArmLibrary", init: {from_params: true}}
      anatomy:
        class: "StaticAnatomy"
        distances: {method: "random"}
        metastatic_libraries: {enabled: false}
    parameters:
      nsites: {dist: fixed, value: 3}
      capacities:
        dist: per_site_from_base
        base: {dist: log_uniform_int, min: 5000000, max: 50000000}
        multiplier: {dist: log_uniform, min: 0.5, max: 2.0}
      min_detectable:
        dist: fraction_of
        of: capacities
        fraction: {dist: uniform, min: 0.05, max: 0.30}
      growth_rate: {dist: uniform, min: 0.002, max: 0.010}
      max_growth_rate_multiplier: {dist: uniform, min: 1.0, max: 4.0}
      epsilon: {dist: log_uniform, min: 1e-10, max: 1e-8}
      focal_driver_rate: {dist: log_uniform, min: 1e-5, max: 5e-4}
      focal_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}
      arm_rate: {dist: log_uniform, min: 1e-7, max: 1e-5}
      chromosomal_rate: {dist: log_uniform, min: 1e-8, max: 1e-6}
      WGD_rate: {dist: log_uniform, min: 1e-10, max: 1e-8}
      SNV_driver_rate: {dist: fixed, value: 0.0}
      SNV_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}
      CN_coeff: {dist: uniform, min: 0.05, max: 0.25}
      ncells_prim: {dist: int_range, min: 5000, max: 20000}
      ncells_meta: {dist: int_range, min: 2000, max: 15000}
      min_mut_fraction: {dist: log_uniform, min: 0.01, max: 0.10}

  - id: "R10_5site_genotype_migration_organotropism"
    n_tumors: 1
    sistem:
      selection_library: {class: "RandomArmLibrary", init: {from_params: true}}
      anatomy:
        class: "GenotypeAnatomy"
        distances: {method: "random"}
        metastatic_libraries: {enabled: true, method: "distance", from_params: true}
    parameters:
      nsites: {dist: fixed, value: 5}
      capacities:
        dist: per_site_from_base
        base: {dist: log_uniform_int, min: 3000000, max: 30000000}
        multiplier: {dist: log_uniform, min: 0.5, max: 2.0}
      min_detectable:
        dist: fraction_of
        of: capacities
        fraction: {dist: uniform, min: 0.08, max: 0.40}
      growth_rate: {dist: uniform, min: 0.003, max: 0.012}
      max_growth_rate_multiplier: {dist: uniform, min: 3.0, max: 12.0}
      epsilon: {dist: log_uniform, min: 1e-9, max: 1e-6}
      alter_prop: {dist: uniform, min: 0.10, max: 0.50}
      focal_driver_rate: {dist: log_uniform, min: 1e-5, max: 5e-4}
      focal_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}
      arm_rate: {dist: log_uniform, min: 1e-7, max: 1e-5}
      chromosomal_rate: {dist: log_uniform, min: 1e-8, max: 1e-6}
      WGD_rate: {dist: log_uniform, min: 1e-10, max: 1e-8}
      SNV_driver_rate: {dist: fixed, value: 0.0}
      SNV_pass_rate: {dist: log_uniform, min: 1e-3, max: 3e-2}
      CN_coeff: {dist: uniform, min: 0.05, max: 0.25}
      ncells_prim: {dist: int_range, min: 3000, max: 12000}
      ncells_meta: {dist: int_range, min: 2000, max: 8000}
      min_mut_fraction: {dist: log_uniform, min: 0.01, max: 0.10}
