# SISTEM Pipeline Configuration
#
# This file centralizes all runtime configuration for the datagen pipeline.
# The orchestrator loads this file and distributes parameters to worker scripts.
# Edit these values to explore new parameter sets.

experiment:
  # Unique label for this batch of simulations
  # All outputs will be written under output/{param_set_id}/
  param_set_id: "exp_004"

  # Number of independent tumors to generate
  total_tumors: 100

  # Number of resamples per tumor
  # Total sample count = total_tumors * resamples_per_tumor
  resamples_per_tumor: 3

# Base SISTEM simulation parameters
# These are passed to the SISTEM Parameters constructor
# The out_dir field is excluded - workers set it to their own output directory
sistem_parameters:
  nsites: 3
  epsilon: 1.0e-9
  min_detectable: 500000
  capacities: 10000000
  focal_driver_rate: 0.0005
  SNV_pass_rate: 0.01
  alter_prop: 0.3
  ncells_prim: 10000
  ncells_meta: 5000
  ncells_normal: 2000
  min_mut_fraction: 0.05
  coverage: 100
